[project]
name = "rockgen-ai"
version = "0.1.0"
description = "RockGen evidence-backed AI scientist helpers"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0",
  "rockgen-graph",
]

[tool.uv.sources]
rockgen-graph = { path = "../graph", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rockgen_ai"]

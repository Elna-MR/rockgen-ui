[project]
name = "rockgen-graph"
version = "0.1.0"
description = "RockGen Neo4j knowledge graph schema, seed, and queries"
requires-python = ">=3.12"
dependencies = [
  "neo4j>=5.27.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
]

[project.scripts]
rockgen-seed = "rockgen_graph.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rockgen_graph"]

[dependency-groups]
dev = ["ruff>=0.9.0"]

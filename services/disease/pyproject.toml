[project]
name = "rockgen-disease"
version = "0.1.0"
description = "RockGen Disease Intelligence Engine — graph-backed scientific dossiers"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "rockgen-graph",
  "rockgen-reasoning",
]

[tool.uv.sources]
rockgen-graph = { path = "../graph", editable = true }
rockgen-reasoning = { path = "../reasoning", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rockgen_disease"]

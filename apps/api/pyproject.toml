[project]
name = "rockgen-api"
version = "0.1.0"
description = "RockGen FastAPI gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "neo4j>=5.27.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.28.0",
  "rockgen-graph",
  "rockgen-reasoning",
  "rockgen-simulations",
  "rockgen-disease",
]

[tool.uv.sources]
rockgen-graph = { path = "../../services/graph", editable = true }
rockgen-reasoning = { path = "../../services/reasoning", editable = true }
rockgen-simulations = { path = "../../services/simulations", editable = true }
rockgen-disease = { path = "../../services/disease", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["ruff>=0.9.0", "httpx>=0.28.0"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-hidden="true">
  <!-- ProtScope mark: soft teal scope + copper protein ribbon -->
  <defs>
    <linearGradient id="ps-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a9aad"/>
      <stop offset="1" stop-color="#1f7a8c"/>
    </linearGradient>
    <linearGradient id="ps-ribbon" x1="18" y1="44" x2="48" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0c9a8"/>
      <stop offset="0.55" stop-color="#e8a070"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#ps-bg)"/>
  <rect x="3.25" y="3.25" width="57.5" height="57.5" rx="16.5" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Soft inner lens -->
  <circle cx="32" cy="32" r="18.5" fill="#ffffff" fill-opacity="0.14"/>
  <circle cx="32" cy="32" r="18.5" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.92"/>
  <circle cx="32" cy="32" r="12.8" stroke="#d7f0f4" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- Cardinal ticks -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.95">
    <path d="M32 12.2v3.6"/>
    <path d="M32 48.2v3.6"/>
    <path d="M12.2 32h3.6"/>
    <path d="M48.2 32h3.6"/>
  </g>

  <!-- Protein ribbon through lens -->
  <path
    d="M21 42
       C20.2 35.2 24.4 27.8 31.6 26.6
       C38.8 25.4 43 31.2 40.2 36.2
       C37.6 40.8 42.6 45.4 47.2 41.8"
    stroke="url(#ps-ribbon)"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M25.2 37.2
       C24.8 33.4 27.8 30.6 31.6 31.6
       C35.4 32.6 36.4 36.4 33.4 38.8
       C30.6 41.2 33.4 44 37.2 42.2"
    stroke="#0f5c6a"
    stroke-opacity="0.55"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <path d="M28.4 33.4 L35.2 29.8 L33 36.2 Z" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="31.6" cy="26.6" r="2.1" fill="#ffffff"/>
  <circle cx="47.2" cy="41.8" r="1.8" fill="#f0c9a8"/>
  <circle cx="21" cy="42" r="1.55" fill="#d7f0f4"/>
</svg>

# Amplify Hosting — Next.js app in monorepo (apps/web)
# Docs: https://docs.aws.amazon.com/amplify/latest/userguide/monorepo-configuration.html
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
